file.upload-dir=./uploads

# Redis
redis.host=localhost
redis.port=6379

# JWT (단위: 분)
# - secret 은 보안 설정이므로 application-secret.properties 의 jwt.secret 에 별도 관리 (gitignored)
jwt.access-token-expiration=15
jwt.refresh-token-expiration=20160

# Access/Refresh Token Cookie 공통 (HttpOnly, Path=/, SameSite=Lax, Secure 는 운영)
# - accessToken / refreshToken 두 Cookie 모두 이 설정을 사용한다 (Cookie 기반 인증)
# - SameSite=Lax: 과제 스펙 기준 (CSRF 방어에 유리) — 크로스사이트 쿠키 전송이 필요한 경우 None 으로 변경
# - Secure 는 HTTPS(운영)에서만 동작 → 로컬 http 개발에서는 false 권장 (배포 시 true)
jwt.refresh-cookie-secure=false
jwt.refresh-cookie-samesite=Lax

# CSRF Token Cookie(XSRF-TOKEN) Secure 속성 (HttpOnly=false, Path=/, SameSite=브라우저 기본 Lax)
# - Secure 는 HTTPS(운영)에서만 동작 → 로컬 http 개발에서는 false 권장 (배포 시 true) — 위와 동일 패턴
jwt.csrf-cookie-secure=false

# 비밀번호 재설정 토큰 (단위: 분)
# - docs: passwordResetToken 은 5분 동안만 유효 (Redis password:reset:{token} TTL)
auth.password-reset-token.ttl-minutes=5

# Mock PASS 본인인증 세션 (단위: 분)
# - Mock 인증 건(Redis mock:pass:{identityVerificationId})의 유효 시간 — OTP 검증까지 사용
mock.pass.ttl.minutes=10

# 이메일 인증번호 (단위: 분)
# - docs: 인증번호는 5분 동안만 유효 (Redis mock:email-verification:{emailHash} TTL)
# - 실제 이메일 서비스 미연동 상태이므로 서버가 인증번호를 생성해 임시 저장하는 Mock 방식
mock.email-verification.ttl.minutes=5

